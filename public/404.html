<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Página no encontrada | Dianita Travel Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color: #193346;
        background: #f8f5ef;
        font-family: "DM Sans", Arial, sans-serif;
        font-synthesis: none;
        --paper: #f8f5ef;
        --ink: #193346;
        --muted: #616b6d;
        --accent: #897244;
        --line: #d8d3ca;
        --button: #193346;
        --button-text: #fffdf8;
      }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
      header { width: min(100%, 1440px); margin: 0 auto; padding: 18px 40px; border-bottom: 1px solid var(--line); }
      .brand { display: inline-flex; flex-direction: column; color: var(--ink); text-decoration: none; }
      .brand-name { font-size: 36px; line-height: 1; }
      .brand-period { color: var(--accent); }
      .brand small { margin: 7px 0 0 3px; font-size: 8px; letter-spacing: 3px; }
      main { flex: 1; width: min(100%, 1000px); margin: 0 auto; padding: 90px 28px; display: grid; align-content: center; justify-items: start; }
      .eyebrow { margin: 0 0 18px; color: var(--accent); font-size: 9px; font-weight: 600; letter-spacing: 2px; }
      h1 { max-width: 800px; margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(48px, 8vw, 78px); font-weight: 400; line-height: 1.05; }
      p { max-width: 480px; margin: 22px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.8; }
      .button { display: inline-flex; min-height: 48px; align-items: center; padding: 14px 21px; border: 1px solid var(--button); border-radius: 2px; background: var(--button); color: var(--button-text); font-size: 10px; font-weight: 600; letter-spacing: 1px; text-decoration: none; }
      .button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      @media (max-width: 600px) { header { padding: 16px 22px; } main { padding: 64px 24px; } }
    </style>
  </head>
  <body>
    <header><a class="brand" href="/" aria-label="Dianita Travel Planner, volver al inicio"><span class="brand-name">Dianita<span class="brand-period">.</span></span><small>TRAVEL PLANNER</small></a></header>
    <main>
      <p class="eyebrow">RUTA NO DISPONIBLE</p>
      <h1>Esta página no está disponible.</h1>
      <p>Regresa al inicio y seguimos planeando tu próximo viaje.</p>
      <a class="button" href="/">VOLVER AL INICIO</a>
    </main>
  </body>
</html>
